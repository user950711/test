        // 第二版(Gemini)
        if (product) {
            let currentSpecIndex = 0; // 新增：記錄目前選中的規格索引
            let currentSpec = product.specs[0];

            document.getElementById("productName").innerText = product.name;
            document.getElementById("productImg").src = currentSpec.img;
            document.getElementById("productDesc").innerText = currentSpec.desc;
            document.getElementById("productPrice").innerText = "$" + currentSpec.price;

            const specArea = document.getElementById("specArea");
            product.specs.forEach((spec, index) => { // 修改：加入 index
                const btn = document.createElement("button");
                btn.innerText = spec.label;
                btn.onclick = () => {
                    currentSpecIndex = index; // 更新索引
                    currentSpec = spec;
                    document.getElementById("productImg").src = spec.img;
                    document.getElementById("productDesc").innerText = spec.desc;
                    document.getElementById("productPrice").innerText = "$" + spec.price;
                };
                specArea.appendChild(btn);
            });

            // 修改後的 addToCart 函式
            window.addToCart = function() { // 確保全域可呼叫
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                
                // 尋找購物車中是否已有「同產品且同規格」的項目
                let item = cart.find(i => i.id === productId && i.specIndex === currentSpecIndex);
                
                if (item) {
                    item.quantity++;
                } else {
                    // 存入時多帶一個 specIndex
                    cart.push({id: productId, specIndex: currentSpecIndex, quantity: 1});
                }
                
                localStorage.setItem('cart', JSON.stringify(cart));
                count = cart.reduce((sum, item) => sum + item.quantity, 0);
                document.getElementById("cartCount").innerText = count;
                alert("已加入購物車！");
            }
        }

        // 漢堡選單
        function toggleMenu() {
            const menu = document.getElementById("navMenu");
            menu.classList.toggle("active");
        }
